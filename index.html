<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia do Batista - Agendamento</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #12151e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1a1e29;
            width: 100%;
            max-width: 420px;
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h2 {
            color: #d4af37;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header h1 {
            color: #d4af37;
            font-size: 1.8rem;
            margin-top: 15px;
            text-align: left;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #e0e0e0;
            font-size: 0.95rem;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-container span.icon {
            position: absolute;
            left: 14px;
            color: #d4af37;
            font-size: 1.1rem;
            pointer-events: none;
        }

        .input-container input,
        .input-container select {
            width: 100%;
            padding: 14px 14px 14px 42px;
            background-color: #12151e;
            border: 1px solid #d4af37;
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-container input:focus,
        .input-container select:focus {
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        }

        .input-container input::placeholder {
            color: #6c757d;
        }

        .input-container select option {
            background-color: #1a1e29;
            color: #ffffff;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            border: none;
            border-radius: 25px;
            color: #000000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>✂ Barbearia do Batista ✂</h2>
            <h1>Novo<br>Agendamento</h1>
        </div>

        <form id="bookingForm">
            <div class="form-group">
                <label for="nome">Seu Nome:</label>
                <div class="input-container">
                    <span class="icon">👤</span>
                    <input type="text" id="nome" placeholder="Digite seu nome completo" required>
                </div>
            </div>

            <div class="form-group">
                <label for="whatsapp">WhatsApp:</label>
                <div class="input-container">
                    <span class="icon">💬</span>
                    <input type="tel" id="whatsapp" placeholder="(00) 00000-0000" required>
                </div>
            </div>

            <div class="form-group">
                <label for="servico">Serviço:</label>
                <div class="input-container">
                    <span class="icon">✂</span>
                    <select id="servico" required>
                        <option value="" disabled selected>Selecione um serviço</option>
                        <option value="Corte de Cabelo">Corte de Cabelo</option>
                        <option value="Barba Tradicional">Barba Tradicional</option>
                        <option value="Corte + Barba">Corte + Barba</option>
                        <option value="Sobrancelha">Sobrancelha</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="dataHora">Data e Horário:</label>
                <div class="input-container">
                    <span class="icon">📅</span>
                    <input type="datetime-local" id="dataHora" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">CONFIRMAR AGENDAMENTO</button>
        </form>
    </div>

    <script>
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const nome = document.getElementById('nome').value;
            const whatsappCliente = document.getElementById('whatsapp').value;
            const servico = document.getElementById('servico').value;
            const dataHoraRaw = document.getElementById('dataHora').value;

            // Formatação simples da data e hora
            const dataObjeto = new Date(dataHoraRaw);
            const dataFormatada = dataObjeto.toLocaleDateString('pt-BR');
            const horaFormatada = dataObjeto.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

            const numeroSeu = '5548992108093';

            const mensagem = `Olá, gostaria de agendar um horário na Barbearia do Batista!\n\n` +
                             `📌 *Nome:* ${nome}\n` +
                             `📱 *WhatsApp:* ${whatsappCliente}\n` +
                             `✂ *Serviço:* ${servico}\n` +
                             `📅 *Data:* ${dataFormatada}\n` +
                             `⏰ *Horário:* ${horaFormatada}`;

            const url = `https://api.whatsapp.com/send?phone=${numeroSeu}&text=${encodeURIComponent(mensagem)}`;

            window.open(url, '_blank');
        });
    </script>

</body>
</html>
