<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senhores da Navalha</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #f1f1f1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #1e1e24;
      border: 1px solid #3d3d4e;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      color: #d4af37;
      font-size: 1.6rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .header p {
      color: #aaa;
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: #ddd;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #3d3d4e;
      background-color: #2a2a36;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #d4af37;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #d4af37;
      color: #121212;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    button:hover {
      background-color: #f1c40f;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>✂️ SENHORES DA NAVALHA ✂️</h1>
      <p>Novo Agendamento</p>
    </div>

    <form id="agendamentoForm">
      <div class="form-group">
        <label for="nome">Seu Nome:</label>
        <input type="text" id="nome" placeholder="Digite seu nome completo" required>
      </div>

      <div class="form-group">
        <label for="whatsapp">WhatsApp:</label>
        <input type="tel" id="whatsapp" placeholder="(00) 00000-0000" required>
      </div>

      <div class="form-group">
        <label for="servico">Serviço:</label>
        <select id="servico" required>
          <option value="" disabled selected>Selecione um serviço</option>
          <option value="Corte de Cabelo">Corte de Cabelo</option>
          <option value="Barba">Barba</option>
          <option value="Cabelo e Barba">Cabelo & Barba</option>
          <option value="Sobrancelha">Sobrancelha</option>
        </select>
      </div>

      <div class="form-group">
        <label for="dataHora">Data e Horário:</label>
        <input type="datetime-local" id="dataHora" required>
      </div>

      <button type="submit">Agendar pelo WhatsApp</button>
    </form>
  </div>

  <script>
    document.getElementById('agendamentoForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const nome = document.getElementById('nome').value;
      const whatsapp = document.getElementById('whatsapp').value;
      const servico = document.getElementById('servico').value;
      const dataHoraRaw = document.getElementById('dataHora').value;
      
      const dataObjeto = new Date(dataHoraRaw);
      const dataFormatada = dataObjeto.toLocaleDateString('pt-BR');
      const horaFormatada = dataObjeto.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

      // Substitua pelo número de WhatsApp da barbearia (com DDD)
      const numeroSeu = '5500000000000'; 

      const mensagem = `Olá, gostaria de agendar um horário no *Senhores da Navalha*!%0A%0A📌 *Nome:* ${nome}%0A📱 *WhatsApp:* ${whatsapp}%0A✂️ *Serviço:* ${servico}%0A📅 *Data:* ${dataFormatada}%0A⏰ *Horário:* ${horaFormatada}`;

      const url = `https://api.whatsapp.com/send?phone=${numeroSeu}&text=${mensagem}`;
      window.open(url, '_blank');
    });
  </script>

</body>
</html>
